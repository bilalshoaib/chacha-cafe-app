<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Chacha Burger &amp; Cafe">
  <!-- Deep teal rounded tile so the burger reads on light and dark browser chrome -->
  <rect width="64" height="64" rx="14" fill="#0f3d38"/>

  <!-- Top bun -->
  <path d="M13 27a19 13 0 0 1 38 0Z" fill="#f0a830"/>
  <circle cx="25" cy="20" r="1.7" fill="#f4faf8"/>
  <circle cx="34" cy="17" r="1.7" fill="#f4faf8"/>
  <circle cx="42" cy="21" r="1.7" fill="#f4faf8"/>

  <!-- Lettuce -->
  <path d="M12 29h40l-3.5 4.2-4.6-2.2-4.6 2.6-4.6-2.6-4.6 2.6-4.6-2.6-4.6 2.2Z" fill="#4faa8f"/>

  <!-- Patty -->
  <rect x="12" y="34" width="40" height="7" rx="3.5" fill="#5c3320"/>

  <!-- Cheese -->
  <path d="M14 34h36l-4 5H18Z" fill="#f0a830" opacity="0.6"/>

  <!-- Bottom bun, in the teal accent -->
  <path d="M13 42h38a12 12 0 0 1-38 0Z" fill="#0d9488"/>
</svg>
